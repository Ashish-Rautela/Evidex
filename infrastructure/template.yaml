AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Evidex SAM Template - Free-tier eligible PostgreSQL architecture

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        DB_SECRET_ARN: !GetAtt DBInstance.MasterUserSecret.SecretArn
        DB_HOST: !GetAtt DBInstance.Endpoint.Address
        DB_PORT: '5432'
        DB_NAME: evidex
        DB_USER: evidex_admin
        S3_BUCKET: !Ref ContractsBucket
        AWS_REGION: !Ref AWS::Region
        SQS_QUEUE_URL: !Ref IngestionQueue
        BEDROCK_EMBED_MODEL_ID: 'amazon.titan-embed-text-v2:0'

Resources:
  # ============================================================================
  # Networking (Self-Contained VPC for RDS PostgreSQL)
  # ============================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub 'evidex-vpc-${Environment}'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub 'evidex-igw-${Environment}'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub 'evidex-subnet-a-${Environment}'

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub 'evidex-subnet-b-${Environment}'

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub 'evidex-rt-${Environment}'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable

  SubnetRouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS PostgreSQL
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS PostgreSQL
      SubnetIds:
        - !Ref SubnetA
        - !Ref SubnetB

  # ============================================================================
  # RDS PostgreSQL Database (Free-Tier Eligible db.t4g.micro with pgvector)
  # ============================================================================
  DBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub 'evidex-db-${Environment}'
      Engine: postgres
      EngineVersion: '16.3'
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      DBName: evidex
      MasterUsername: evidex_admin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      PubliclyAccessible: true

  # ============================================================================
  # Storage & Messaging
  # ============================================================================
  ContractsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'evidex-contracts-${AWS::AccountId}-${Environment}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  IngestionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'evidex-ingestion-queue-${Environment}'
      VisibilityTimeout: 960
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestionDLQ.Arn
        maxReceiveCount: 3

  IngestionDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'evidex-ingestion-dlq-${Environment}'
      MessageRetentionPeriod: 1209600

  TextractCompleteTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'evidex-textract-complete-${Environment}'

  TextractServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: textract.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TextractSNSPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref TextractCompleteTopic

  # ============================================================================
  # Authentication (Amazon Cognito)
  # ============================================================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'evidex-users-${Environment}'
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: tenant_id
          AttributeDataType: String
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'evidex-client-${Environment}'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ============================================================================
  # API Gateway
  # ============================================================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
        DefaultAuthorizer: CognitoAuthorizer

  # ============================================================================
  # Lambda Functions
  # ============================================================================
  UploadHandler:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/upload.handler.handler
      CodeUri: ../backend/dist/
      MemorySize: 256
      Timeout: 30
      Events:
        UploadIntent:
          Type: HttpApi
          Properties:
            Path: /api/v1/documents/upload-intent
            Method: POST
            ApiId: !Ref HttpApi
        UploadConfirm:
          Type: HttpApi
          Properties:
            Path: /api/v1/documents/{id}/confirm
            Method: POST
            ApiId: !Ref HttpApi
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ContractsBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt IngestionQueue.QueueName
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !GetAtt DBInstance.MasterUserSecret.SecretArn

  SearchHandler:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/search.handler.handler
      CodeUri: ../backend/dist/
      MemorySize: 512
      Timeout: 30
      Events:
        Search:
          Type: HttpApi
          Properties:
            Path: /api/v1/search
            Method: POST
            ApiId: !Ref HttpApi
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ContractsBucket
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !GetAtt DBInstance.MasterUserSecret.SecretArn
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock-agent-runtime:Rerank
              Resource: '*'

  DocumentHandler:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/document.handler.handler
      CodeUri: ../backend/dist/
      MemorySize: 256
      Timeout: 15
      Events:
        ListDocs:
          Type: HttpApi
          Properties:
            Path: /api/v1/documents
            Method: GET
            ApiId: !Ref HttpApi
        GetDoc:
          Type: HttpApi
          Properties:
            Path: /api/v1/documents/{id}
            Method: GET
            ApiId: !Ref HttpApi
        GetClauses:
          Type: HttpApi
          Properties:
            Path: /api/v1/documents/{id}/clauses
            Method: GET
            ApiId: !Ref HttpApi
        AddAcl:
          Type: HttpApi
          Properties:
            Path: /api/v1/documents/{id}/acl
            Method: POST
            ApiId: !Ref HttpApi
        DeleteDoc:
          Type: HttpApi
          Properties:
            Path: /api/v1/documents/{id}
            Method: DELETE
            ApiId: !Ref HttpApi
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ContractsBucket
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !GetAtt DBInstance.MasterUserSecret.SecretArn

  ExtractHandler:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/extract.handler.handler
      CodeUri: ../backend/dist/
      MemorySize: 512
      Timeout: 60
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt IngestionQueue.Arn
            BatchSize: 1
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ContractsBucket
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !GetAtt DBInstance.MasterUserSecret.SecretArn
        - Statement:
            - Effect: Allow
              Action:
                - textract:StartDocumentAnalysis
              Resource: '*'
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt TextractServiceRole.Arn

  ChunkHandler:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/chunk.handler.handler
      CodeUri: ../backend/dist/
      MemorySize: 1024
      Timeout: 900
      Events:
        SNSTrigger:
          Type: SNS
          Properties:
            Topic: !Ref TextractCompleteTopic
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ContractsBucket
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !GetAtt DBInstance.MasterUserSecret.SecretArn
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'

# ============================================================================
# Outputs
# ============================================================================
Outputs:
  ApiUrl:
    Description: HTTP API Gateway endpoint URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  S3BucketName:
    Description: S3 Contracts Bucket Name
    Value: !Ref ContractsBucket
  SQSQueueUrl:
    Description: SQS Ingestion Queue URL
    Value: !Ref IngestionQueue
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  DBEndpoint:
    Description: RDS PostgreSQL Endpoint Address
    Value: !GetAtt DBInstance.Endpoint.Address
